<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAILE — AI Avatar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ========== AUTH GATE ========== -->
    <div id="auth-gate" class="auth-gate">
        <div class="auth-card">
            <h1>HAILE</h1>
            <p>Enter access code to continue</p>
            <div class="auth-input-group">
                <input type="password" id="auth-input" placeholder="Access code" autocomplete="off" />
                <button id="auth-submit">&rarr;</button>
            </div>
            <p id="auth-error" class="auth-error" style="display:none;"></p>
        </div>
    </div>

    <!-- ========== LANGUAGE TOGGLE (global, above all screens) ========== -->
    <div id="language-toggle" class="language-toggle" style="display:none;">
        <button id="btn-language" class="btn-language" title="Change language">
            <img id="lang-flag" class="btn-language-flag" src="https://flagcdn.com/w40/gb.png" alt="gb" />
        </button>
        <div id="language-dropdown" class="language-dropdown" style="display:none;"></div>
    </div>

    <!-- ========== SCREEN 1: SLEEP ========== -->
    <div id="screen-sleep" class="screen screen-sleep active">
        <div class="sleep-content">
            <h1 class="sleep-title">HAILE</h1>
            <p class="sleep-subtitle">AI Avatar Assistant</p>
            <div class="sleep-avatar">
                <div class="sleep-glow"></div>
                <img class="sleep-icon" src="images/haile_sleeping.png" alt="HAILE sleeping" />
                <div class="sleep-zzz">
                    <span>z</span><span>z</span><span>z</span>
                </div>
            </div>
            <button id="btn-wake" class="btn-wake">
                <span id="wake-label">Wake Up HAILE</span>
                <span id="wake-loading" class="hidden">Waking up<span class="wake-dots">...</span></span>
            </button>
        </div>
    </div>

    <!-- ========== SCREEN 2: MAIN (avatar + chat) ========== -->
    <div id="screen-main" class="screen">

        <!-- Back button (top-left) -->
        <button id="btn-back" class="btn-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>

        <!-- Transcript toggle button (top-right) -->
        <button id="btn-toggle-transcript" class="btn-toggle-transcript" title="Toggle transcript">
            <svg id="transcript-icon-show" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/>
            </svg>
            <svg id="transcript-icon-hide" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/>
                <line x1="3" y1="21" x2="21" y2="3" stroke="currentColor" stroke-width="2"/>
            </svg>
        </button>

        <!-- Full-screen avatar background -->
        <div class="avatar-bg">
            <div id="avatar-placeholder" class="avatar-placeholder">
                <div class="avatar-loading-spinner"></div>
                <p id="status-text">Connecting...</p>
                <div id="speaking-indicator" class="speaking-indicator">
                    <span class="speaking-dot"></span>
                    <span class="speaking-dot"></span>
                    <span class="speaking-dot"></span>
                </div>
            </div>
            <video id="avatar-video" class="avatar-video hidden" autoplay playsinline muted></video>
        </div>

        <!-- Chat overlay (bottom-right) -->
        <div class="chat-overlay">
            <div id="chat-messages" class="chat-messages"></div>

            <div class="chat-input-area">
                <button id="btn-mic" class="btn-mic" title="Toggle microphone">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <input type="text" id="chat-input" placeholder="Type a message..."
                       autocomplete="off" />
                <button id="btn-send" class="btn-send" title="Send">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Listening indicator overlay (top-center) -->
        <div id="listening-badge" class="listening-badge hidden">
            <span class="listening-pulse"></span>
            <span>Listening...</span>
        </div>

    </div>

    <!-- Azure Speech SDK (pinned to v1.x for stability) -->
    <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
